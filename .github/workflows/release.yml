name: Build and release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        continue-on-error: true
      - run: npm run package:win
      - name: Trim other platforms' 7-Zip binaries
        shell: pwsh
        run: |
          $z = "release/PBZ Mod Manager-win32-x64/resources/app.asar.unpacked/node_modules/7zip-bin"
          Remove-Item -Recurse -Force "$z/linux", "$z/mac", "$z/win/ia32", "$z/win/arm64" -ErrorAction SilentlyContinue
          Copy-Item README.md "release/PBZ Mod Manager-win32-x64/"
      - name: Zip
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/PBZ Mod Manager-win32-x64" -DestinationPath "PBZ-Mod-Manager-Windows-x64-$v.zip"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: PBZ-Mod-Manager-Windows-x64-*.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: windows-build
          path: PBZ-Mod-Manager-Windows-x64-*.zip
